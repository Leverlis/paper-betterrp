  no-permission-admin: "<red>ᴅᴜ ʜᴀꜱᴛ ᴋᴇɪɴᴇ ʙᴇʀᴇᴄʜᴛɪɢᴜɴɢ ꜰüʀ ᴅɪᴇꜱᴇɴ ʙᴇꜰᴇʜʟ.</red>"
